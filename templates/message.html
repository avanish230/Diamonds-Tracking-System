{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}

<div id="popup"
    class="popup {{ messages[0][0] }}"
    data-category="{{ messages[0][0] }}"
    data-message="{{ messages[0][1] }}">

    <div id="popup-icon" class="popup-icon">i</div>

    <div class="popup-content">
        <strong id="popup-title">Message</strong>
        <span id="popup-message"></span>
    </div>

    <button type="button" id="popup-close" class="popup-close">×</button>
</div>

<style>
    .popup {
        position: fixed;
        top: 22px;
        right: -450px;
        z-index: 9999;
        width: 360px;
        max-width: calc(100vw - 32px);
        padding: 14px;
        border: 1px solid #b9cef8;
        border-left: 4px solid #0f3d91;
        border-radius: 10px;
        background: #eef4ff;
        box-shadow: 0 12px 30px rgba(15, 61, 145, 0.18);
        display: flex;
        align-items: center;
        gap: 12px;
        transition: right 0.35s ease;
    }

    .popup.show {
        right: 22px;
    }

    .popup.success {
        border-color: #bde8ce;
        border-left-color: #087443;
        background: #edf9f2;
    }

    .popup.danger,
    .popup.error {
        border-color: #f5c8c5;
        border-left-color: #b42318;
        background: #fff1f0;
    }

    .popup.warning {
        border-color: #f1d29a;
        border-left-color: #a15c00;
        background: #fff7e8;
    }

    .popup-icon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 50%;
        color: #fff;
        background: #0f3d91;
        display: grid;
        place-items: center;
        font-size: 17px;
        font-weight: bold;
    }

    .popup.success .popup-icon {
        background: #087443;
    }

    .popup.danger .popup-icon,
    .popup.error .popup-icon {
        background: #b42318;
    }

    .popup.warning .popup-icon {
        background: #a15c00;
    }

    .popup-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 3px;
    }

    .popup-content strong {
        color: #172033;
        font-size: 13px;
    }

    .popup-content span {
        color: #475467;
        font-size: 13px;
        line-height: 1.4;
    }

    .popup-close {
        border: none;
        cursor: pointer;
        color: #667085;
        background: transparent;
        font-size: 22px;
        line-height: 1;
    }

    .popup-close:hover {
        color: #172033;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var popup = document.getElementById("popup");
        var popupMessage = document.getElementById("popup-message");
        var popupTitle = document.getElementById("popup-title");
        var popupIcon = document.getElementById("popup-icon");
        var closeButton = document.getElementById("popup-close");

        var category = popup.dataset.category;
        var messageText = popup.dataset.message;

        if (category === "success") {
            popupTitle.textContent = "Success";
            popupIcon.textContent = "✓";
        } else if (category === "danger" || category === "error") {
            popupTitle.textContent = "Error";
            popupIcon.textContent = "!";
        } else if (category === "warning") {
            popupTitle.textContent = "Warning";
            popupIcon.textContent = "!";
        } else {
            popupTitle.textContent = "Information";
            popupIcon.textContent = "i";
        }

        popupMessage.textContent = messageText;

        setTimeout(function () {
            popup.classList.add("show");
        }, 100);

        function hidePopup() {
            popup.classList.remove("show");
        }

        closeButton.addEventListener("click", hidePopup);

        setTimeout(hidePopup, 4000);
    });
</script>

{% endif %}
{% endwith %}
