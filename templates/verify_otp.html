<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Sonal Impex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
</head>

<body>
    <header class="header">
        <a href="{{ url_for('home') }}" class="brand">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Sonal Impex Logo">
            <span>Sonal Impex<small>Diamond Tracking System</small></span>
        </a>

        <a href="{{ url_for('login') }}" class="login-link">Back to Login</a>
    </header>

    <main class="forgot-page">
        <section class="forgot-content">
            <span>ACCOUNT RECOVERY</span>
            <h1>Verify OTP</h1>
            <p>Enter the OTP sent to your registered email address.</p>

            {% include "message.html" %}

            <form method="POST">
                <label for="otp">One-Time Password</label>
                <input type="text" id="otp" name="otp"
                    placeholder="Enter OTP" required autocomplete="one-time-code">

                <button type="submit">Verify OTP</button>
            </form>
        </section>
    </main>
</body>
</html>
