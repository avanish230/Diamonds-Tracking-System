<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | Sonal Impex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_asset.css') }}">
</head>

<body>

    <header class="header">
        <a href="{{ url_for('view_employees') }}" class="back-btn">
            ← Back to Employees
        </a>

        <a href="{{ url_for('home') }}" class="brand">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Sonal Impex Logo">

            <span>
                <strong>Sonal Impex</strong>
                <small>Diamond Tracking System</small>
            </span>
        </a>
    </header>

    <main class="page-content">

        <section class="form-container">

            <span class="form-tag">EMPLOYEE MANAGEMENT</span>

            <h1>Edit Employee</h1>

            <p>Update the employee details below.</p>

            {% include "message.html" %}

            <form method="POST">

                <div class="input-group">
                    <label for="employee_name">Employee Name</label>
                    <input
                        type="text"
                        id="employee_name"
                        name="employee_name"
                        value="{{ employee.employee_name }}"
                        required>
                </div>

                <div class="input-group">
                    <label for="employee_code">Employee Code</label>
                    <input
                        type="text"
                        id="employee_code"
                        name="employee_code"
                        value="{{ employee.employee_code }}"
                        readonly>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ employee.email }}"
                        required>
                </div>

                <div class="input-group">
                    <label for="phone_number">Phone Number</label>
                    <input
                        type="text"
                        id="phone_number"
                        name="phone_number"
                        maxlength="10"
                        value="{{ employee.phone_number }}"
                        required>
                </div>

                <div class="buttons">
                    <a href="{{ url_for('view_employees') }}" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="update-btn">
                        Update Employee
                    </button>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
