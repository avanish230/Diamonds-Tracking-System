<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Sonal Impex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
</head>

<body>
    <header class="header">
        <a href="{{ url_for('home') }}" class="brand">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Sonal Impex Logo">
            <span>Sonal Impex<small>Diamond Tracking System</small></span>
        </a>

        <a href="{{ url_for('login') }}" class="login-link">Back to Login</a>
    </header>

    <main class="forgot-page">
        <section class="forgot-content">
            <span>ACCOUNT RECOVERY</span>
            <h1>Forgot Password?</h1>
            <p>Enter your registered email address to receive an OTP.</p>

            {% include "message.html" %}

            <form method="POST">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email"
                    placeholder="Enter your registered email" required>

                <button type="submit">Send OTP</button>
            </form>
        </section>
    </main>
</body>
</html>
