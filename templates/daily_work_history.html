<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Work</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/daily_work.css') }}">
</head>

<body>

    <nav class="navbar navbar-dark" style="background:#0F3D91;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold">
                Sonal Impex
            </a>
        </div>

    </nav>
    <a href="{{ url_for('employee_dashboard') }}" class="back-btn">
        ← Back
    </a><br><br><br>
    <div class="card history-card">
        <h4 class="mb-3">
            My Daily Work
        </h4>

        <div class="table-responsive">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Quantity</th>
                    </tr>
                </thead>

                <tbody>
                    {% for work in history %}
                    <tr>
                        <td>
                            {{ work.work_date.strftime("%d-%m-%Y") }}
                        </td>

                        <td>
                            {{ work.quantity }}
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <br>

    <div class="card total-card">
        <h5>
            This Month Total
        </h5>

        <h1>
            {{ month_total }}
        </h1>
    </div>
    </div>
</body>

</html>
