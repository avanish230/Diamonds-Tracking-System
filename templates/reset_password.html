<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Sonal Impex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
</head>

<body>
    <header class="header">
        <a href="{{ url_for('home') }}" class="brand">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Sonal Impex Logo">
            <span>
                Sonal Impex
                <small>Diamond Tracking System</small>
            </span>
        </a>

        <a href="{{ url_for('login') }}" class="login-link">Back to Login</a>
    </header>

    <main class="forgot-page">
        <section class="forgot-content">
            <span class="page-tag">ACCOUNT RECOVERY</span>
            <h1>Reset Password</h1>
            <p>Create a new secure password for your account.</p>

            {% include "message.html" %}

            <form method="POST">
                <label for="password">New Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password"
                        placeholder="Enter new password" required>

                    <button type="button" class="password-toggle"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">
                        👁
                    </button>
                </div>

                <label for="confirm_password">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm_password" name="confirm_password"
                        placeholder="Confirm new password" required>

                    <button type="button" class="password-toggle"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show password">
                        👁
                    </button>
                </div>

                <button type="submit" class="submit-button">Change Password</button>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/reset_password.js') }}"></script>
</body>
</html>
