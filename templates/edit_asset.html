<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Kapan | Sonal Impex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_asset.css') }}">
</head>

<body>
    <header class="header">
        <a href="{{ url_for('view_assets') }}" class="back-btn">← Back to Assets</a>

        <a href="{{ url_for('home') }}" class="brand">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Sonal Impex Logo">
            <span>
                <strong>Sonal Impex</strong>
                <small>Diamond Tracking System</small>
            </span>
        </a>
    </header>

    <main class="page-content">
        <section class="form-container">
            <span class="form-tag">ASSET MANAGEMENT</span>
            <h1>Edit Kapan</h1>
            <p>Update the Kapan details below.</p>

            {% include "message.html" %}

            <form method="POST">
                <div class="input-group">
                    <label for="kapan_number">Kapan Number</label>
                    <input type="text" id="kapan_number" name="kapan_number"
                        value="{{ asset.kapan_number }}" required>
                </div>

                <div class="input-group">
                    <label for="total_quantity">Total Quantity</label>
                    <input type="number" id="total_quantity" name="total_quantity"
                        value="{{ asset.total_quantity }}" min="1" required>
                </div>

                <div class="input-group">
                    <label for="available_quantity">Available Quantity</label>
                    <input type="number" id="available_quantity"
                        value="{{ asset.available_quantity }}" readonly>
                </div>

                <div class="buttons">
                    <a href="{{ url_for('view_assets') }}" class="cancel-btn">Cancel</a>
                    <button type="submit" class="update-btn">Update Kapan</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
